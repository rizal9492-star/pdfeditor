<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tools Pro - Client-side Suite</title>
  <!-- Memuat library pdf-lib langsung dari CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --primary: #e5322d;
      --primary-hover: #c62828;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #e0e6ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 8px;
    }

    p.subtitle {
      text-align: center;
      color: #606f7b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #4b5563;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fafafa;
    }

    input[type="file"] {
      cursor: pointer;
    }

    .info-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 5px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-action:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }

    .status-info {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .status-success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PDF Tools Pro</h1>
    <p class="subtitle">Edit dan manipulasi PDF langsung dari browser tanpa unggah server.</p>

    <!-- Navigasi Tab -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('split')">Pisahkan PDF (Split)</button>
      <button class="tab-btn" onclick="switchTab('merge')">Gabungkan PDF (Merge)</button>
    </div>

    <!-- Panel Split PDF -->
    <div id="split-panel" class="tab-content active">
      <div class="form-group">
        <label for="split-input">Pilih File PDF:</label>
        <input type="file" id="split-input" accept="application/pdf" />
      </div>

      <div class="form-group">
        <label for="page-range">Halaman yang Diekstrak:</label>
        <input type="text" id="page-range" placeholder="Contoh: 1-3, 5 (Kosongkan untuk Halaman 1 saja)" />
        <p class="info-text">Gunakan strip untuk rentang halaman dan koma untuk halaman terpisah.</p>
      </div>

      <button id="split-btn" class="btn-action" onclick="executeSplit()">Ekstrak Halaman</button>
    </div>

    <!-- Panel Merge PDF -->
    <div id="merge-panel" class="tab-content">
      <div class="form-group">
        <label for="merge-input">Pilih File PDF (Minimal 2 File):</label>
        <input type="file" id="merge-input" accept="application/pdf" multiple />
        <p class="info-text">Tahan tombol Ctrl (atau Cmd di Mac) saat memilih file untuk menandai banyak file.</p>
      </div>

      <button id="merge-btn" class="btn-action" onclick="executeMerge()">Gabungkan PDF</button>
    </div>

    <!-- Area Status / Feedback -->
    <div id="status-box"></div>
  </div>

  <script>
    const { PDFDocument } = PDFLib;

    // Navigasi perpindahan tampilan tab
    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));

      if (type === 'split') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('split-panel').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('merge-panel').classList.add('active');
      }
      hideStatus();
    }

    // Helper untuk menampilkan notifikasi UI
    function showStatus(text, type = 'info') {
      const box = document.getElementById('status-box');
      box.textContent = text;
      box.className = `status-${type}`;
      box.style.display = 'block';
    }

    function hideStatus() {
      const box = document.getElementById('status-box');
      box.style.display = 'none';
    }

    // Mengurai string rentang halaman (contoh: "1-3, 5") menjadi indeks 0-based
    function parsePageIndices(rangeString, maxPages) {
      if (!rangeString.trim()) return [0]; // default: ambil halaman 1 (indeks 0)

      const indices = new Set();
      const parts = rangeString.split(',');

      for (const part of parts) {
        const range = part.trim().split('-');
        if (range.length === 2) {
          const start = parseInt(range[0], 10);
          const end = parseInt(range[1], 10);
          if (!isNaN(start) && !isNaN(end) && start <= end) {
            for (let i = start; i <= end; i++) {
              if (i >= 1 && i <= maxPages) indices.add(i - 1);
            }
          }
        } else if (range.length === 1) {
          const page = parseInt(range[0], 10);
          if (!isNaN(page) && page >= 1 && page <= maxPages) {
            indices.add(page - 1);
          }
        }
      }
      return Array.from(indices).sort((a, b) => a - b);
    }

    // Mengunduh byte array sebagai file fisik di browser
    function triggerDownload(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // Logika Pemisahan PDF (Split)
    async function executeSplit() {
      const fileInput = document.getElementById('split-input');
      const rangeInput = document.getElementById('page-range').value;
      const file = fileInput.files[0];

      if (!file) {
        showStatus('Harap pilih file PDF terlebih dahulu.', 'error');
        return;
      }

      showStatus('Sedang memproses pemisahan dokumen...', 'info');

      try {
        const fileBuffer = await file.arrayBuffer();
        const srcPdf = await PDFDocument.load(fileBuffer);
        const totalPages = srcPdf.getPageCount();

        const targetIndices = parsePageIndices(rangeInput, totalPages);
        if (targetIndices.length === 0) {
          showStatus(`Rentang halaman tidak valid. Dokumen ini hanya memiliki ${totalPages} halaman.`, 'error');
          return;
        }

        const outPdf = await PDFDocument.create();
        const extractedPages = await outPdf.copyPages(srcPdf, targetIndices);
        extractedPages.forEach(page => outPdf.addPage(page));

        const pdfBytes = await outPdf.save();
        triggerDownload(pdfBytes, `split-${file.name}`);
        showStatus(`Sukses mengekstrak ${targetIndices.length} halaman!`, 'success');
      } catch (err) {
        showStatus(`Gagal memproses PDF: ${err.message}`, 'error');
      }
    }

    // Logika Penggabungan PDF (Merge)
    async function executeMerge() {
      const fileInput = document.getElementById('merge-input');
      const files = Array.from(fileInput.files);

      if (files.length < 2) {
        showStatus('Pilih minimal 2 file PDF untuk digabungkan.', 'error');
        return;
      }

      showStatus(`Sedang menggabungkan ${files.length} file...`, 'info');

      try {
        const outPdf = await PDFDocument.create();

        for (const file of files) {
          const fileBuffer = await file.arrayBuffer();
          const srcPdf = await PDFDocument.load(fileBuffer);
          const pages = await outPdf.copyPages(srcPdf, srcPdf.getPageIndices());
          pages.forEach(page => outPdf.addPage(page));
        }

        const pdfBytes = await outPdf.save();
        triggerDownload(pdfBytes, 'dokumen-gabungan.pdf');
        showStatus('Sukses menggabungkan seluruh dokumen PDF!', 'success');
      } catch (err) {
        showStatus(`Gagal menggabungkan PDF: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
